[workspace]
resolver = "3"
members = [
    "crates/disphas-protocol",
    "crates/disphas-core",
    "crates/disphas-device",
    "crates/disphas-license",
    "crates/disphas-helper",
    "crates/disphas-report",
    "public/disphas-attestation",
    "public/disphas-verify",
    "app/src-tauri",
    "tools/disphas-issuer",
    "tools/disphas-signer",
]
# cargo-fuzz project, built with nightly on its own.
exclude = ["fuzz"]

# Shared metadata for the PRIVATE crates only.
# Crates under public/ deliberately do not inherit anything from this file:
# they must be extractable as-is into the public repository.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
disphas-attestation = { path = "public/disphas-attestation" }
disphas-protocol = { path = "crates/disphas-protocol" }
disphas-core = { path = "crates/disphas-core" }
disphas-device = { path = "crates/disphas-device" }
disphas-license = { path = "crates/disphas-license" }
disphas-report = { path = "crates/disphas-report" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
