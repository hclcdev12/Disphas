# Release packages (packaging/README.md): built on Ubuntu 22.04 so the
# binaries need glibc 2.35 at most, checked, then installed and removed on
# clean systems of each supported distribution. Manual, or on a version tag.
# Nothing here touches a drive: only package installation in containers.
name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A `v*` tag is a release: the package carries the workspace version,
      # which must match the tag. Any other build carries `+build.<run number>`:
      # every package has its own version, so apt upgrades without --reinstall
      # and the installed build can be told apart (docs/reprise.md §2, point 6).
      - name: Package version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$base" ]; then
              echo "tag $GITHUB_REF_NAME does not match the workspace version $base"; exit 1
            fi
            version=$base
          else
            version="$base+build.$GITHUB_RUN_NUMBER"
          fi
          echo "package version: $version"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build .deb and .rpm
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles deb rpm --config "{\"version\": \"$PACKAGE_VERSION\"}"

      - name: Check glibc and declared dependencies
        run: python3 tools/check_package.py target/release/bundle/deb/*.deb --max-glibc 2.35

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  install-deb:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Install on a clean system
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./deb/*.deb
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' oblivio

      - name: The oblivio group of an earlier version is removed
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          groupadd --system oblivio
          apt-get install -y --reinstall ./deb/*.deb
          if getent group oblivio; then echo "the former oblivio group is still there"; exit 1; fi

      - name: Every library resolves, files are in place
        run: |
          for program in /usr/bin/oblivio-app /usr/libexec/oblivio/oblivio-helper; do
            ldd "$program" | tee ldd.txt
            if grep -q "not found" ldd.txt; then echo "missing library for $program"; exit 1; fi
          done
          test -f /usr/share/polkit-1/actions/org.oblivio.helper.policy
          test -f /usr/share/doc/oblivio/THIRD-PARTY-NOTICES.txt

      - name: State tree is root-owned with the expected modes
        run: |
          test "$(stat -c '%U:%G %a' /var/lib/oblivio)" = "root:root 700"
          for sub in keys license jobs recovery reports; do
            test "$(stat -c '%U:%G %a' /var/lib/oblivio/$sub)" = "root:root 700"
          done

      - name: The release helper refuses to run outside pkexec
        run: |
          if /usr/libexec/oblivio/oblivio-helper </dev/null; then
            echo "the helper must refuse to start without pkexec"; exit 1
          fi

      - name: remove keeps the data, purge deletes it
        run: |
          mkdir -p /var/lib/oblivio/reports
          touch /var/lib/oblivio/reports/example.cose
          apt-get remove -y oblivio
          test -f /var/lib/oblivio/reports/example.cose
          apt-get purge -y oblivio
          test ! -e /var/lib/oblivio

  install-rpm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "fedora:latest"
            install: dnf install -y --nogpgcheck ./rpm/*.rpm
          - image: "opensuse/tumbleweed"
            install: zypper --non-interactive install --allow-unsigned-rpm ./rpm/*.rpm
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Install on a clean system
        run: |
          rpm -qp --requires ./rpm/*.rpm
          ${{ matrix.install }}

      - name: The oblivio group of an earlier version is removed
        run: |
          if ! command -v groupadd >/dev/null; then echo "no groupadd in this image: skipped"; exit 0; fi
          groupadd --system oblivio
          rpm -Uvh --replacepkgs ./rpm/*.rpm
          if getent group oblivio; then echo "the former oblivio group is still there"; exit 1; fi

      - name: Every library resolves, files are in place
        run: |
          for program in /usr/bin/oblivio-app /usr/libexec/oblivio/oblivio-helper; do
            ldd "$program" | tee ldd.txt
            if grep -q "not found" ldd.txt; then echo "missing library for $program"; exit 1; fi
          done
          test -f /usr/share/polkit-1/actions/org.oblivio.helper.policy

      - name: State tree is root-owned with the expected modes
        run: |
          test "$(stat -c '%U:%G %a' /var/lib/oblivio)" = "root:root 700"
          for sub in keys license jobs recovery reports; do
            test "$(stat -c '%U:%G %a' /var/lib/oblivio/$sub)" = "root:root 700"
          done

      - name: The release helper refuses to run outside pkexec
        run: |
          if /usr/libexec/oblivio/oblivio-helper </dev/null; then
            echo "the helper must refuse to start without pkexec"; exit 1
          fi

      - name: Removal keeps the data
        run: |
          mkdir -p /var/lib/oblivio/reports
          touch /var/lib/oblivio/reports/example.cose
          rpm -e "$(rpm -qp --queryformat '%{NAME}' ./rpm/*.rpm)"
          test -f /var/lib/oblivio/reports/example.cose
