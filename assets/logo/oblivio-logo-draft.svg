<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé Indigo Marque -->
    <linearGradient id="oblivioIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Dégradé Fond Carte Shield -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Ombre interne / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arrière-plan conteneur (#090D16 - Night Slate) -->
  <rect width="512" height="512" rx="96" fill="#090D16"/>

  <!-- Lignes de bus / Pistes matérielles d'arrière-plan -->
  <g stroke="#1F2937" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="30" x2="256" y2="72" />
    <line x1="256" y1="440" x2="256" y2="482" />
    <line x1="30" y1="256" x2="72" y2="256" />
    <line x1="440" y1="256" x2="482" y2="256" />
  </g>

  <!-- Puce Hexagonale / Sceau d'ancrage Hardware -->
  <polygon points="256,72 412,162 412,342 256,432 100,342 100,162" 
           fill="url(#shieldBg)" 
           stroke="url(#oblivioIndigo)" 
           stroke-width="8" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Tracés pointillés internes (Circuit d'audit) -->
  <polygon points="256,98 388,174 388,330 256,406 124,330 124,174" 
           fill="none" 
           stroke="#374151" 
           stroke-width="3" 
           stroke-dasharray="8 6"/>

  <!-- Le 'O' Central (Oblivio / Amnésie) -->
  <!-- Anneau externe blanc acier -->
  <circle cx="256" cy="252" r="68" fill="none" stroke="#F9FAFB" stroke-width="14"/>
  
  <!-- Césure / Rupture du 'O' en Indigo (Symbole d'amnésie/coupure du flux) -->
  <circle cx="256" cy="252" r="68" stroke="url(#oblivioIndigo)" stroke-width="14" fill="none" stroke-dasharray="140 80" stroke-dashoffset="35"/>

  <!-- Cœur du composant : Noyau Émeraude (Témoin d'audit / Conformité) -->
  <circle cx="256" cy="252" r="18" fill="#10B981"/>
  <circle cx="256" cy="252" r="32" fill="none" stroke="#10B981" stroke-width="3" opacity="0.4"/>

  <!-- Connecteurs / Pins aux 6 sommets de l'hexagone -->
  <circle cx="256" cy="72" r="6" fill="#818CF8"/>
  <circle cx="412" cy="162" r="6" fill="#818CF8"/>
  <circle cx="412" cy="342" r="6" fill="#818CF8"/>
  <circle cx="256" cy="432" r="6" fill="#818CF8"/>
  <circle cx="100" cy="342" r="6" fill="#818CF8"/>
  <circle cx="100" cy="162" r="6" fill="#818CF8"/>
</svg>
