[package]
name = "disphas-app"
description = "disphas desktop application: Tauri shell relaying the UI to the root helper."
version.workspace = true
edition.workspace = true
# disphas-report (typst) requires Rust 1.92.
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[lib]
name = "disphas_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
disphas-attestation = { workspace = true, features = ["pdf"] }
disphas-license.workspace = true
disphas-protocol.workspace = true
disphas-report.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "~2.4.5"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1.9.0"

# Desktop notifications through the freedesktop D-Bus service (GNOME, KDE...).
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "~4.17.0"
# Already used by notify-rust: asks systemd-logind for a sleep (power.rs).
zbus = "~5.13.2"

[lints]
workspace = true

[dev-dependencies]
disphas-report = { path = "../../crates/disphas-report", features = ["fixtures"] }
sha2 = "0.11"
tempfile = "3.27.0"
