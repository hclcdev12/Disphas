[package]
name = "oblivio-app"
description = "Oblivio desktop application: Tauri shell relaying the UI to the root helper."
version.workspace = true
edition.workspace = true
# oblivio-report (typst) requires Rust 1.92.
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[lib]
name = "oblivio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
oblivio-attestation.workspace = true
oblivio-license.workspace = true
oblivio-protocol.workspace = true
oblivio-report.workspace = true
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }

[lints]
workspace = true
