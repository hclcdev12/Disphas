[package]
name = "disphas-verify"
description = "Command-line verifier for disphas erasure certificates. Fully offline."
version = "0.1.0"
edition = "2024"
# 1.88: PDF reading (lopdf).
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
disphas-attestation = { path = "../disphas-attestation", version = "0.1.0", features = ["pdf"] }

# No workspace inheritance on purpose: this crate is extracted as-is into the
# public repository and must not depend on anything under crates/ or app/.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3.27.0"
