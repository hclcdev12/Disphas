[package]
name = "oblivio-verify"
description = "Command-line verifier for Oblivio erasure certificates. Fully offline."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
oblivio-attestation = { path = "../oblivio-attestation", version = "0.1.0" }

# No workspace inheritance on purpose: this crate is extracted as-is into the
# public repository and must not depend on anything under crates/ or app/.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3.27.0"
