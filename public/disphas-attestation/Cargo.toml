[package]
name = "disphas-attestation"
description = "disphas attestation schema, CBOR/COSE decoding and offline signature verification."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

# No workspace inheritance on purpose: this crate is extracted as-is into the
# public repository and must not depend on anything under crates/ or app/.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
ciborium = "0.2.2"
coset = "0.4.2"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
miniz_oxide = "0.9.1"
sha2 = "0.11.0"
thiserror = "2.0.21"
lopdf = { version = "0.45.0", default-features = false, optional = true }

[features]
# Reading the attachments of certificate PDFs. Requires Rust 1.88 (lopdf).
pdf = ["dep:lopdf"]
