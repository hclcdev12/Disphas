[package]
name = "disphas-protocol"
description = "Message types and protocol version for the UI <-> helper boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", optional = true }
zeroize = "1.9.0"

[features]
ts-rs = ["dep:ts-rs"]
