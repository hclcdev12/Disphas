[package]
name = "oblivio-device"
description = "The only crate that talks to storage devices: NVMe/ATA ioctls, SG_IO, O_DIRECT, sysfs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Cargo cannot override a single inherited lint, so the workspace set is
# repeated here with `unsafe_code` relaxed: direct ioctls and aligned buffers
# need unsafe, and every block must carry a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# Tests on a real drive: also need OBLIVIO_TEST_DEVICE. Never run by default.
hw-tests = []

[dependencies]
libc = "0.2.190"
oblivio-core.workspace = true
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
