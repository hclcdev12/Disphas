[package]
name = "oblivio-report"
description = "PDF/A-3 certificate rendering, QR code, translations (Fluent). No disk access, no private key."
version.workspace = true
edition.workspace = true
# typst 0.15 requires Rust 1.92; the rest of the workspace targets 1.85.
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[dependencies]
fluent-bundle = "0.16.0"
oblivio-attestation.workspace = true
qrcode = { version = "0.14.1", default-features = false }
sha2 = "0.11"
thiserror = "2.0.21"
typst = "0.15"
typst-as-lib = { version = "0.16", default-features = false }
typst-layout = "0.15"
typst-pdf = "0.15"
unic-langid = "0.9.6"

[features]
# Fictional attestations signed with fixed test keys. Tests and examples only.
fixtures = []

[[example]]
name = "sample"
required-features = ["fixtures"]

[[example]]
name = "demo_certificates"
required-features = ["fixtures"]

[lints]
workspace = true

[dev-dependencies]
oblivio-attestation = { workspace = true, features = ["pdf"] }
rqrr = "0.10.1"
