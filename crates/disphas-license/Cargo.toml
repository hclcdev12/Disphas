[package]
name = "disphas-license"
description = "Offline .lic parsing and verification, workstation key, activation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test bench packages only (tools/bench/package.sh --bench-root): a release
# build that also trusts the public development root, so the bench can be
# licensed without the official root key. Never in a shipped package.
bench-root = []

[dependencies]
getrandom = "0.4.3"
disphas-attestation.workspace = true
thiserror = "2.0.21"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
