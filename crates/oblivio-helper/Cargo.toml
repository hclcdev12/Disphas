[package]
name = "oblivio-helper"
description = "Root helper: runs the decision engine, device operations and signing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oblivio-attestation.workspace = true
oblivio-protocol.workspace = true
oblivio-core.workspace = true
oblivio-device.workspace = true
oblivio-license.workspace = true
serde_json = "1.0.151"
zeroize = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }
getrandom = "0.4.3"
base64 = "0.23.1"
