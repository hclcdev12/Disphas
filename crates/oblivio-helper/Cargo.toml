[package]
name = "oblivio-helper"
description = "Root helper: runs the decision engine, device operations and signing."
version.workspace = true
edition.workspace = true
# File::try_lock (job locks).
rust-version = "1.89"
license.workspace = true
publish.workspace = true

[dependencies]
oblivio-attestation.workspace = true
oblivio-protocol.workspace = true
oblivio-core = { version = "0.1.0", path = "../oblivio-core", features = ["serde"] }
oblivio-device.workspace = true
oblivio-license.workspace = true
serde_json = "1.0.151"
zeroize = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }
getrandom = "0.4.3"
base64 = "0.23.1"
sha2 = "0.11"
thiserror = "2.0.21"

[features]
# Fictional in-memory drives, one per verdict state, for UI development.
# Refused at compile time in release builds.
demo = []
# Real drives in a development build: test bench only, as root, with the
# owner's consent (CLAUDE.md §2). Release builds always use real drives.
real-devices = []

[lints]
workspace = true

[dev-dependencies]
serde = "1.0.229"
tempfile = "3.27.0"
