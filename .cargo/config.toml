[env]
# TypeScript bindings of disphas-protocol, generated by
# `cargo test -p disphas-protocol --features ts-rs export_bindings`.
TS_RS_EXPORT_DIR = { value = "app/src/bindings", relative = true }
# JSON.parse yields numbers, not bigints. Every 64-bit value of the protocol
# (capacities, epoch seconds, byte counts) stays below 2^53.
TS_RS_LARGE_INT = "number"
